<!doctype html>
<html lang="en">
<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		{% load static %}
		<title>{% block title %}SkillSync AI{% endblock %}</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
		<link rel="stylesheet" href="{% static 'css/styles.css' %}">
		<style>
		/* small utility styles used by templates */
		.btn-gradient{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none}
		.hover-lift{transition:transform .18s ease;}
		.hover-lift:hover{transform:translateY(-6px)}
		</style>
		{% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
	<div class="container">
		<a class="navbar-brand fw-bold" href="/">SkillSync AI</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="nav">
			<ul class="navbar-nav ms-auto">
				<li class="nav-item"><a class="nav-link" href="/register.html">Register</a></li>
				<li class="nav-item"><a class="nav-link" href="/login.html">Login</a></li>
			</ul>
		</div>
	</div>
</nav>

<main>
	<div>
		{% block content %}{% endblock %}
	</div>
</main>

<footer class="py-4 bg-light mt-5">
	<div class="container text-center text-muted">© {{ now|date:"Y" }} SkillSync AI</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/app.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
